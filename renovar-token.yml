name: Renovar token do Instagram

on:
  schedule:
    - cron: "0 12 1,15 * *"   # dias 1 e 15 de cada mes
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    env:
      TEM_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Renovar e atualizar o segredo IG_TOKEN
        if: env.TEM_PAT == 'true'
        run: python renovar_token.py | gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY"
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
      - name: Aviso (sem GH_PAT)
        if: env.TEM_PAT != 'true'
        run: echo "Segredo GH_PAT ausente: renove o IG_TOKEN manualmente a cada ~50 dias (veja o README)."
