name: Coleta diaria e relatorio semanal

on:
  schedule:
    - cron: "0 1 * * *"    # coleta diaria, 22:00 em Brasilia
    - cron: "0 11 * * 1"   # segunda 08:00 em Brasilia: coleta + relatorio
  workflow_dispatch:

permissions:
  contents: write

concurrency: instagram-estado

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar curtidas e comentarios
        run: python coletar.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Relatorio (segunda-feira ou execucao manual)
        if: github.event.schedule == '0 11 * * 1' || github.event_name == 'workflow_dispatch'
        run: python relatorio.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Salvar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metricas.json relatorios
          git diff --cached --quiet || (git commit -m "metricas e relatorio" && git pull --rebase && git push)
