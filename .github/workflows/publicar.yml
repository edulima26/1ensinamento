name: Publicar post do dia

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 07:00 em Brasilia
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular (nao publica nada)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: instagram-estado

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar
        run: python publicar.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      - name: Salvar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "estado: post publicado" && git pull --rebase && git push)
